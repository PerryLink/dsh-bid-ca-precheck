# 投标符合性预检 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ⚠️⚠️ 本规则库的诚实说明：**excerpt 一律不是引文。**
#   本插件核对的是"投标文件对招标文件逐条要求的响应台账"是否齐备、自洽。
#   **核查未取得**《招标投标法》《招标投标法实施条例》以及各类评标办法的逐字条文，
#   因此本规则库**不伪造任何"原文"**：每条规则的 excerpt 都写明"该条文本次未取得"，
#   依据状态放在 note 里如实说明；kind 一律降为 derived-from-principle（封顶 warn）
#   或 institutional-configuration（封顶 info）。
#   **取得条文后必须做两件事**：把 excerpt 换成真正的逐字摘录，把 kind 升为 direct。
#   在那之前，本插件的命中信息只应被读作"这一条没写响应 / 这一栏空着 / 结论不在册"，
#   而**不是**"投标无效"或"违反了某条法规"。
#
# ⚠️⚠️ 另一条**必须保留**的边界：**本插件绝不判定投标是否有效、是否废标、
#   是否构成实质性偏离**。那需要评标委员会依据招标文件与评标办法作出判断，
#   而且**招标文件的具体要求因项目而异、评标办法也因项目而异**。
#   → 因此本插件只核对**台账自身的齐备与自洽**：
#     逐条是否有响应、结论取值是否在册、条款号是否唯一、高风险条款是否有证明材料、
#     招标要求是否还留着未填的占位符。
#   → 结论取值清单（verdicts）与高风险条款关键词（highRiskKeywords）**都出厂为空**，
#     未配置即进 skipped，绝不静默通过。

plugin: dsh-bid-ca-precheck
version: "2026.1"

rules:
  - id: BC-001
    title: 每条招标要求都应有对应的投标响应
    severity: warn
    basis:
      document: 《中华人民共和国招标投标法》
      number: 1999年8月30日通过，2017年12月27日修正（全国人大常委会《关于修改〈中华人民共和国招标投标法〉、〈中华人民共和国计量法〉的决定》），本法自2000年1月1日起施行
      clause: 第二十七条第一款——投标文件应当对招标文件提出的实质性要求和条件作出响应
      excerpt: 投标人应当按照招标文件的要求编制投标文件。投标文件应当对招标文件提出的实质性要求和条件作出响应。
      kind: direct
      source: https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/201806/t20180629_776538.html
    params:
      check:
        kind: presence
        field: response
        fix: 补填响应内容；本条只核对是否填写，不判断该响应对招标要求是否构成实质性满足
    note: >-
      ✅ **`kind` 已升为 `direct`**（2026-10-07 判定，见 rules/evidence/clause-verification-tender-law-articles.md）：
      **第二十七条第一款逐字要求**「投标文件应当对招标文件提出的**实质性要求和条件作出响应**」——
      "逐条响应"正是该条要求的直接落点。
      逐条响应的**台账完整性**是符合性检查的前提：一条要求没有响应记录，检查就无从开始。
      本次未取得明文条号，故封顶 warn。
      本条只核对"响应栏是否填写"，**不判断响应内容是否满足招标要求**——
      那是评标委员会的判断，也是本插件刻意不做的判断。
      若某条要求经评估确实无需响应（例如仅为告知性条款），建议在备注栏写明理由，而不是留空。

  - id: BC-002
    title: 响应结论应使用本机构口径的取值
    severity: info
    basis:
      document: 《中华人民共和国招标投标法实施条例》
      number: 国务院令第613号（2011 年 12 月 20 日公布，2017 年 3 月 1 日修订，自 2012 年 2 月 1 日起施行）
      clause: 关于响应性评审与资格条件的条款（本次未取得条号；⚠️ 参见第五十一条"评标委员会应当否决其投标"的七项情形，其中第（六）项即"投标文件没有对招标文件的实质性要求和条件作出响应"）
      excerpt: 该条文本次未取得：核查未获得《招标投标法实施条例》的逐字原文，本规则库不伪造引文。
      kind: institutional-configuration
      source: https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/201806/t20180629_776538.html
    params:
      check:
        kind: enum
        field: verdict
        values: []
    note: >-
      ✅ **版本与一条相关条文已于 2026-10-07 补充核实**（见 rules/evidence/clause-verification-tender-law-articles.md）：
      《招标投标法实施条例》为**国务院令第 613 号**（2011-12-20 公布，2017-03-01 修订，**自 2012-02-01 施行**）；
      其**第五十一条**逐字规定「有下列情形之一的，**评标委员会应当否决其投标**：……
      （六）**投标文件没有对招标文件的实质性要求和条件作出响应**」。
      ⚠️ **但本条仍保持"未取得条号"的表述与 `institutional-configuration` 定性**：
      `values`（响应结论的取值）**是本机构口径**，**不是该条例规定的**。
      values 出厂为空，表示**未配置**，本条进 skipped。
      依据说明：结论的取值口径（例如「满足」「部分满足」「不满足」「待确认」，
      或「响应」「偏离」「废标项」）随**本机构或本项目评标办法**变化，本插件**不硬编码任何取值清单**。
      本条只核对所填值是否在册；**不判断该结论是否正确**，
      更**不因为出现某个取值就认定投标无效**——那是评标委员会的职权。

  - id: BC-003
    title: 条款号应在台账内唯一
    severity: warn
    basis:
      document: 《中华人民共和国招标投标法》
      number: 1999年8月30日通过，2017年12月27日修正（全国人大常委会《关于修改〈中华人民共和国招标投标法〉、〈中华人民共和国计量法〉的决定》），本法自2000年1月1日起施行
      clause: 第二十七条第二款——建设施工投标文件应包括拟派项目负责人与主要技术人员的简历、业绩和拟用机械设备
      excerpt: 投标人应当按照招标文件的要求编制投标文件。投标文件应当对招标文件提出的实质性要求和条件作出响应。招标项目属于建设施工的，投标文件的内容应当包括拟派出的项目负责人与主要技术人员的简历、业绩和拟用于完成招标项目的机械设备等。
      kind: derived-from-principle
      source: https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/201806/t20180629_776538.html
    params:
      check:
        kind: unique
        field: clause
    note: >-
      ⚠️ **`kind` 仍为 `derived-from-principle`**（2026-10-07 判定）：
      **第二十七条要求的是投标文件"应当响应"与"应当包括"哪些内容**，
      **并未规定台账的条款号不得重复** —— 唯一性只是**可追溯性的前提条件**。
      ⇒ 保留 `derived-from-principle`；`excerpt` 换为**第二十七条第一、二款的逐字引文**。
      条款号唯一是可追溯的**前提条件**：同一编号出现两次，就无法判断哪一行对应哪一条要求。
      本次未取得明文条号，故封顶 warn。比较时忽略空白字符。
      命中通常意味着重复登记，或条款号抄错，需人工确认。

  - id: BC-004
    title: 台账应声明其招标项目与投标人
    severity: warn
    basis:
      document: 《中华人民共和国招标投标法》
      number: 1999年8月30日通过，2017年12月27日修正（全国人大常委会《关于修改〈中华人民共和国招标投标法〉、〈中华人民共和国计量法〉的决定》），本法自2000年1月1日起施行
      clause: 第二十八条——投标文件应在截止时间前送达，招标人收到后应当签收保存，不得开启
      excerpt: 投标人应当在招标文件要求提交投标文件的截止时间前，将投标文件送达投标地点。招标人收到投标文件后，应当签收保存，不得开启。
      kind: derived-from-principle
      source: https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/201806/t20180629_776538.html
    params:
      check:
        kind: headerPresence
        fields: [project, bidder]
    note: >-
      ⚠️ **`kind` 仍为 `derived-from-principle`**（2026-10-07 判定）：
      **第二十八条规范的是投标文件的送达与签收**，**未要求任何台账声明项目与投标人** ——
      那两栏的必要性来自**本插件结论的可追溯性**。⇒ 保留 `derived-from-principle`。
      台账若不写明是哪个项目、哪家投标人的响应，结论无法追溯。
      本次未取得明文条号，这是可追溯性的**前提条件**，故封顶 warn。
      配置项 project 对应材料顶层的项目名称，bidder 对应投标人名称。

  - id: BC-005
    title: 高风险条款应填写证明材料
    severity: warn
    basis:
      document: 《中华人民共和国招标投标法》
      number: 1999年8月30日通过，2017年12月27日修正，自2000年1月1日起施行
      clause: 第三十条——拟将中标项目部分非主体、非关键性工作分包的，应当在投标文件中载明
      excerpt: 投标人根据招标文件载明的项目实际情况，拟在中标后将中标项目的部分非主体、非关键性工作进行分包的，应当在投标文件中载明。
      kind: direct
      source: https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/201806/t20180629_776538.html
    params:
      check:
        kind: highRiskEvidence
        evidenceField: evidence
        requirementField: requirement
      highRiskKeywords: []
    note: >-
      ⚠️⚠️ **本条依据已于 2026-10-07 更正 —— 原先挂错了文件**：
      本条原先把 `document` 写作**《招标投标法实施条例》**、`clause` 写作**第三十条**，
      但**实施条例第三十条讲的是"两阶段招标"**（技术复杂或无法精确拟定技术规格的项目），
      **与分包毫无关系**；**实施条例中关于分包的是第五十九条第二款**，
      而该款规范的是**中标人**的分包，`"并不得再次分包"`，**不是投标人的披露义务**。
      ⇒ **投标人一侧的披露义务出自《招标投标法》第三十条**（逐字见 `excerpt`），故已改引该条。
      ✅ **`kind` 升为 `direct`**：第三十条逐字要求「**应当在投标文件中载明**」，
      分包事项属于**必须在投标文件中披露的事项**，"证明材料"栏正是该披露要求的落点。
      本条只对**本机构标记为高风险**的条款要求填写证明材料：
      highRiskKeywords 出厂为空，表示**未配置**，本条进 skipped。
      依据说明：哪些条款必须附证明（资格条件、业绩要求、关键参数、实质性条款等）
      取决于**招标文件本身**，各项目差别很大；本插件**不硬编码任何高风险条款清单**，
      由使用方填入本项目关注的关键词，例如 highRiskKeywords: [资格, 业绩, 实质性, 星号条款]。
      关键词按**包含**匹配 requirement 栏（可用 requirementField 改名）。
      本条只核对证明材料栏是否填写，**不判断证明材料是否有效**。

  - id: BC-006
    title: 招标要求栏不应残留未替换的占位符
    severity: warn
    basis:
      document: 《中华人民共和国招标投标法》
      number: 1999年8月30日通过，2017年12月27日修正（全国人大常委会《关于修改〈中华人民共和国招标投标法〉、〈中华人民共和国计量法〉的决定》），本法自2000年1月1日起施行
      clause: 第二十三条——对已发出的招标文件作澄清或修改，应当在截止时间至少十五日前书面通知所有收受人
      excerpt: 招标人对已发出的招标文件进行必要的澄清或者修改的，应当在招标文件要求提交投标文件截止时间至少十五日前，以书面形式通知所有招标文件收受人。……招标人应当确定投标人编制投标文件所需要的合理时间；但是，依法必须进行招标的项目，自招标文件开始发出之日起至投标人提交投标文件截止之日止，最短不得少于二十日。
      kind: derived-from-principle
      source: https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/201806/t20180629_776538.html
    params:
      check:
        kind: containsAny
        field: requirement
        terms: ['【', '】', '{{', '}}', 'XXX', 'xxx', '待填', '待补充', 'TBD', 'todo']
        fix: 台账里的招标要求应来自正式的招标文件；占位符未替换说明台账是照模板抄的
    note: >-
      ⚠️ **`kind` 仍为 `derived-from-principle`**（2026-10-07 判定）：
      **第二十三条与第二十四条规范的是澄清修改的通知期限与投标期限**，
      **均未就台账占位符作任何规定** —— 本条核对的是"台账是否照抄模板"。
      ⇒ 保留 `derived-from-principle`。
      ⚠️ **并注意：第二十四条的"二十日"是最短投标期限，不得把它当作本插件应当内置的期限**。
      台账若直接照抄了模板，招标要求栏里常留下【】、{{}}、XXX、待填、TBD 之类占位符。
      这会让人误以为已经核对了实际要求——**这是台账类工具最危险的失效方式**。
      本次未取得明文条号，故封顶 warn。
      terms 为本条查找的占位符清单，可按本机构模板调整。

disabled: []
